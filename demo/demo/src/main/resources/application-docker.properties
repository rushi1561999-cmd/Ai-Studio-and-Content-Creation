spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
server.port=8081

jwt.secret=${JWT_SECRET}
ai.gemini.api.key=${GEMINI_API_KEY:}
replicate.api.token=${REPLICATE_API_TOKEN:}
ai.processing.rabbitmq=${AI_PROCESSING_RABBITMQ:true}
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES}
app.cache.provider=${APP_CACHE_PROVIDER:redis}
prompt.assistant.redis-rate-limit-enabled=${PROMPT_REDIS_RATE_LIMIT_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:redis}
ai.job-stream.redis-enabled=${AI_JOB_STREAM_REDIS_ENABLED:true}

stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
razorpay.api.key=${RAZORPAY_API_KEY:}
razorpay.api.secret=${RAZORPAY_API_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.email.enabled=${APP_EMAIL_ENABLED:false}
