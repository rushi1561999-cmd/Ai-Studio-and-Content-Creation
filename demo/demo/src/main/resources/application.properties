spring.application.name=ai-studio
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cdac}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.validation-timeout=1000

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:25MB}
app.storage.root=${APP_STORAGE_ROOT:./data/assets}
app.storage.max-file-bytes=${APP_STORAGE_MAX_FILE_BYTES:26214400}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.config.import=optional:classpath:application-local.properties

jwt.secret=${JWT_SECRET:}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.name=AI Studio
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.admin.seed.enabled=${APP_ADMIN_SEED_ENABLED:false}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.name=${APP_ADMIN_NAME:Platform Admin}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
ai.gemini.api.key=${GEMINI_API_KEY:}
ai.gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent}

replicate.api.token=${REPLICATE_API_TOKEN:}
replicate.image.predictions-url=${REPLICATE_IMAGE_PREDICTIONS_URL:https://api.replicate.com/v1/models/black-forest-labs/flux-schnell/predictions}
replicate.video.predictions-url=${REPLICATE_VIDEO_PREDICTIONS_URL:https://api.replicate.com/v1/models/minimax/video-01/predictions}

ai.provider.connect-timeout=${AI_PROVIDER_CONNECT_TIMEOUT:10s}
ai.provider.read-timeout=${AI_PROVIDER_READ_TIMEOUT:60s}

prompt.assistant.timeout=${PROMPT_ASSISTANT_TIMEOUT:5s}
prompt.assistant.rate-limit-per-minute=${PROMPT_RATE_LIMIT_PER_MINUTE:10}
prompt.assistant.daily-limit.free=${PROMPT_DAILY_LIMIT_FREE:20}
prompt.assistant.daily-limit.paid=${PROMPT_DAILY_LIMIT_PAID:200}
prompt.assistant.daily-limit.enterprise=${PROMPT_DAILY_LIMIT_ENTERPRISE:500}
prompt.assistant.enterprise-credit-threshold=${PROMPT_ENTERPRISE_CREDIT_THRESHOLD:1000}
prompt.assistant.redis-rate-limit-enabled=${PROMPT_REDIS_RATE_LIMIT_ENABLED:false}
app.cache.provider=${APP_CACHE_PROVIDER:caffeine}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
ai.job-stream.redis-enabled=${AI_JOB_STREAM_REDIS_ENABLED:false}

ai.processing.rabbitmq=${AI_PROCESSING_RABBITMQ:false}
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
ai.workers.text.concurrency=${AI_TEXT_WORKER_CONCURRENCY:8-16}
ai.workers.image.concurrency=${AI_IMAGE_WORKER_CONCURRENCY:2-4}
ai.workers.video.concurrency=${AI_VIDEO_WORKER_CONCURRENCY:1-2}

app.executors.prompt.core-size=${PROMPT_EXECUTOR_CORE:8}
app.executors.prompt.max-size=${PROMPT_EXECUTOR_MAX:16}
app.executors.prompt.queue-capacity=100
app.executors.text.core-size=${TEXT_EXECUTOR_CORE:8}
app.executors.text.max-size=${TEXT_EXECUTOR_MAX:16}
app.executors.text.queue-capacity=200
app.executors.media.core-size=${MEDIA_EXECUTOR_CORE:2}
app.executors.media.max-size=${MEDIA_EXECUTOR_MAX:4}
app.executors.media.queue-capacity=40
app.executors.email.core-size=2
app.executors.email.max-size=4
app.executors.email.queue-capacity=100

server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:20}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:200}
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript,text/event-stream

management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
razorpay.api.key=${RAZORPAY_API_KEY:}
razorpay.api.secret=${RAZORPAY_API_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
